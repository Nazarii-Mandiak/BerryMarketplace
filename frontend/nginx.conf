server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Without these, nginx buffers the whole response before forwarding it (and defaults
    # to HTTP/1.0 upstream, which doesn't support chunked responses at all) - that breaks
    # the chat SSE stream: the browser gets nothing until the agent loop finishes, then
    # everything at once.
    proxy_buffering off;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri /index.html;
  }
}
